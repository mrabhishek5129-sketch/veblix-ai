<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="144" height="144" viewBox="0 0 144 144">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="50%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="144" height="144" rx="32" fill="url(#bg)"/>
  
  <!-- Glow overlay -->
  <rect width="144" height="144" rx="32" fill="url(#glow)"/>

  <!-- Sparkle / Star icon centered -->
  <g transform="translate(72, 72)">
    <!-- Main 4-point star -->
    <path d="M0,-27.5 L6.875,-6.875 L27.5,0 L6.875,6.875 L0,27.5 L-6.875,6.875 L-27.5,0 L-6.875,-6.875 Z"
      fill="white" opacity="0.95"/>
    <!-- Small dots -->
    <circle cx="23" cy="-23" r="4" fill="white" opacity="0.7"/>
    <circle cx="-19" cy="21" r="3" fill="white" opacity="0.5"/>
  </g>
</svg>