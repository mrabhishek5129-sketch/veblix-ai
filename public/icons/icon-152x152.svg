<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="152" height="152" viewBox="0 0 152 152">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="50%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="152" height="152" rx="33" fill="url(#bg)"/>
  
  <!-- Glow overlay -->
  <rect width="152" height="152" rx="33" fill="url(#glow)"/>

  <!-- Sparkle / Star icon centered -->
  <g transform="translate(76, 76)">
    <!-- Main 4-point star -->
    <path d="M0,-29 L7.25,-7.25 L29,0 L7.25,7.25 L0,29 L-7.25,7.25 L-29,0 L-7.25,-7.25 Z"
      fill="white" opacity="0.95"/>
    <!-- Small dots -->
    <circle cx="24" cy="-24" r="4" fill="white" opacity="0.7"/>
    <circle cx="-20" cy="22" r="3" fill="white" opacity="0.5"/>
  </g>
</svg>