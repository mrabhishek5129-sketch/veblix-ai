<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="50%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="192" height="192" rx="42" fill="url(#bg)"/>
  
  <!-- Glow overlay -->
  <rect width="192" height="192" rx="42" fill="url(#glow)"/>

  <!-- Sparkle / Star icon centered -->
  <g transform="translate(96, 96)">
    <!-- Main 4-point star -->
    <path d="M0,-37 L9.25,-9.25 L37,0 L9.25,9.25 L0,37 L-9.25,9.25 L-37,0 L-9.25,-9.25 Z"
      fill="white" opacity="0.95"/>
    <!-- Small dots -->
    <circle cx="31" cy="-31" r="5" fill="white" opacity="0.7"/>
    <circle cx="-26" cy="28" r="3" fill="white" opacity="0.5"/>
  </g>
</svg>