<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="384" height="384" viewBox="0 0 384 384">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="50%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="384" height="384" rx="84" fill="url(#bg)"/>
  
  <!-- Glow overlay -->
  <rect width="384" height="384" rx="84" fill="url(#glow)"/>

  <!-- Sparkle / Star icon centered -->
  <g transform="translate(192, 192)">
    <!-- Main 4-point star -->
    <path d="M0,-73.5 L18.375,-18.375 L73.5,0 L18.375,18.375 L0,73.5 L-18.375,18.375 L-73.5,0 L-18.375,-18.375 Z"
      fill="white" opacity="0.95"/>
    <!-- Small dots -->
    <circle cx="62" cy="-62" r="10" fill="white" opacity="0.7"/>
    <circle cx="-51" cy="56" r="7" fill="white" opacity="0.5"/>
  </g>
</svg>