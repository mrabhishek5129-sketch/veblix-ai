<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="50%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="113" fill="url(#bg)"/>
  
  <!-- Glow overlay -->
  <rect width="512" height="512" rx="113" fill="url(#glow)"/>

  <!-- Sparkle / Star icon centered -->
  <g transform="translate(256, 256)">
    <!-- Main 4-point star -->
    <path d="M0,-98.5 L24.625,-24.625 L98.5,0 L24.625,24.625 L0,98.5 L-24.625,24.625 L-98.5,0 L-24.625,-24.625 Z"
      fill="white" opacity="0.95"/>
    <!-- Small dots -->
    <circle cx="83" cy="-83" r="13" fill="white" opacity="0.7"/>
    <circle cx="-69" cy="75" r="9" fill="white" opacity="0.5"/>
  </g>
</svg>