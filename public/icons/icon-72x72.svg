<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="50%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="72" height="72" rx="16" fill="url(#bg)"/>
  
  <!-- Glow overlay -->
  <rect width="72" height="72" rx="16" fill="url(#glow)"/>

  <!-- Sparkle / Star icon centered -->
  <g transform="translate(36, 36)">
    <!-- Main 4-point star -->
    <path d="M0,-14 L3.5,-3.5 L14,0 L3.5,3.5 L0,14 L-3.5,3.5 L-14,0 L-3.5,-3.5 Z"
      fill="white" opacity="0.95"/>
    <!-- Small dots -->
    <circle cx="12" cy="-12" r="2" fill="white" opacity="0.7"/>
    <circle cx="-10" cy="11" r="1" fill="white" opacity="0.5"/>
  </g>
</svg>