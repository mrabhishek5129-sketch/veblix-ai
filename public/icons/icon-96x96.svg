<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="50%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="96" height="96" rx="21" fill="url(#bg)"/>
  
  <!-- Glow overlay -->
  <rect width="96" height="96" rx="21" fill="url(#glow)"/>

  <!-- Sparkle / Star icon centered -->
  <g transform="translate(48, 48)">
    <!-- Main 4-point star -->
    <path d="M0,-18.5 L4.625,-4.625 L18.5,0 L4.625,4.625 L0,18.5 L-4.625,4.625 L-18.5,0 L-4.625,-4.625 Z"
      fill="white" opacity="0.95"/>
    <!-- Small dots -->
    <circle cx="16" cy="-16" r="2" fill="white" opacity="0.7"/>
    <circle cx="-13" cy="14" r="2" fill="white" opacity="0.5"/>
  </g>
</svg>